<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Riandro</title><link rel="stylesheet" href="/static/style.css"></head><body style="min-height:100vh;display:grid;place-items:center;background:#eff8f8"><form method="post" class="checkout" style="width:min(92vw,390px)"><h2 style="font-size:28px">Área administrativa</h2><p>Conferência de pagamentos e comprovantes.</p><input type="hidden" name="csrf" value="{{csrf}}"><label>Senha de acesso<input type="password" name="password" required autofocus></label><button class="btn primary block" type="submit">Entrar</button>{% if error %}<p style="color:#a33;font-size:12px">{{error}}</p>{% endif %}<a href="/" style="display:block;margin-top:22px;font-size:12px">← Voltar para a campanha</a></form><script>document.querySelector('form').addEventListener('submit',e=>{document.querySelector('input[name=csrf]').value='{{csrf}}'})</script></body></html>
