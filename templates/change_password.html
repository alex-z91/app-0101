<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Definir nova senha — Rifa Solidária</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body style="min-height:100vh;display:grid;place-items:center;background:#eff8f8">
  <form method="post" class="checkout" style="width:min(92vw,420px)">
    <h2 style="font-size:27px">Crie sua nova senha</h2>
    <p>Por segurança, antes de acessar os pagamentos, defina uma senha pessoal. Ela ficará salva no sistema.</p>
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Nova senha
      <input type="password" name="password" minlength="12" autocomplete="new-password" required autofocus>
    </label>
    <label>Repita a nova senha
      <input type="password" name="confirm_password" minlength="12" autocomplete="new-password" required>
    </label>
    <small style="display:block;margin:10px 0;color:#526b75">Use pelo menos 12 caracteres. Prefira uma senha única que não use em outros serviços.</small>
    <button class="btn primary block" type="submit">Salvar nova senha e entrar</button>
    {% if error %}<p style="color:#a33;font-size:13px">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/logout"></form>
  </form>
</body>
</html>
